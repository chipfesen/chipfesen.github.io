title: "chipfesen's blog"
description: 漏洞复现 · 固件分析 · 二进制安全
theme: minima
lang: zh-CN

url: "https://chipfesen.github.io"
baseurl: ""

# 顶部导航只保留首页。
# 不写这一项的话，minima 会把所有带 title 的页面都塞进导航栏，
# AFL 的 index.md 就是这样冒出来的（导航栏全局生效，所以每个页面都能看到）。
header_pages:
  - index.md

# md/ 下的原始归档稿不发布（仍在 Git 仓库里），避免和正式文章重复；
# 图片目录不受影响，照常发布。
exclude:
  - md/AFL/AFL源码分析.md
  - md/CVE-2026-8260/2026-10-13-CVE-2026-8260.md
  - tools/
